services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      TRACKDECK_DATABASE_URL: postgresql://trackdeck:trackdeck@db:5432/trackdeck
      TRACKDECK_MUSICBRAINZ_CONTACT: you@example.com
      TRACKDECK_ENABLE_MOCK_DESTINATION: "true"
    depends_on: [db]
  db:
    image: postgres:16
    environment: {POSTGRES_USER: trackdeck, POSTGRES_PASSWORD: trackdeck, POSTGRES_DB: trackdeck}
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
