# Render Blueprint: New > Blueprint > pick this repo. Free plan, Docker.
services:
  - type: web
    name: trackdeck-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TRACKDECK_ENVIRONMENT
        value: production
      - key: TRACKDECK_DATABASE_URL
        sync: false            # paste your Neon connection string (Render dashboard)
      - key: TRACKDECK_MUSICBRAINZ_CONTACT
        sync: false            # your email; MusicBrainz requires it in the User-Agent
      - key: TRACKDECK_CORS_ORIGINS
        sync: false            # e.g. ["https://trackdeck.vercel.app"]  (JSON list)
      - key: TRACKDECK_ENABLE_MOCK_DESTINATION
        value: "false"
      - key: TRACKDECK_TRUST_PROXY_HEADERS
        value: "true"
